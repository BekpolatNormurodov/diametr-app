server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    # Real files answered here keep the same name on every deploy, so the browser
    # must revalidate them (cheap 304 via ETag). The index.html fallback is an
    # internal redirect and gets the no-store headers of `location = /index.html`.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # index.html is the pointer to the current hashed bundle, so it must NEVER
    # be cached — otherwise a browser keeps loading an old index.html that
    # references a stale bundle, and users see no updates until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Hashed build assets are content-addressed → cache them forever.
    # Vite puts every hashed file under /assets/; a new deploy means new URLs.
    # (No `expires` here: it would emit a second Cache-Control header.)
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Everything else with a static extension is copied from public/ with a
    # FIXED name (images/logo.png, payments/payme.png …). A deploy can replace it
    # in place, so it must be revalidated, never "immutable".
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
