# ═══════════════════════════════════════════════════════════════════════════════
#  Diametr – Docker Compose
#
#  Domains handled by nginx:
#    diametr.uz              → frontend (React / CRA)
#    dashboard.diametr.uz    → dashboard (Vite/React)
#    admin.diametr.uz        → dashboard (same service)
#    api.diametr.uz          → backend (NestJS) ×2 replicas — load balanced
#
#  Run:
#    docker compose up -d --build
#
#  Scale backend manually (optional override):
#    docker compose up -d --scale backend=3
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── MySQL ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: diametr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      TZ:                  ${TZ:-Asia/Tashkent}
    volumes:
      # Data persisted on the local host disk (point to your existing MySQL datadir)
      - ${MYSQL_DATA_PATH:-./mysql_data}:/var/lib/mysql
    # ports:
    #   - "127.0.0.1:3306:3306"  # commented: host MySQL already uses 3306
    networks:
      - diametr_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "root", "--password=${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ─── Backend (NestJS + Prisma 6) — 2 replicas ────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
      DB_HOST:      mysql
      DB_PORT:      3306
      DB_USER:      ${DB_USER}
      DB_PASSWORD:  ${DB_PASSWORD}
      PORT:         8888
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRES:         ${JWT_EXPIRES:-30d}
      LOG_DIR:             /app/logs
      TZ:                  ${TZ:-Asia/Tashkent}
      # Telegram bot — BotFather tokenini va chat IDlarini .env ga yozing
      # TELEGRAM_CHAT_IDS=123456789,-100987654321  (vergul bilan)
      # BACKEND_URL=https://api.diametr.uz  (webhook uchun)
      TELEGRAM_BOT_TOKEN:     ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS:      ${TELEGRAM_CHAT_IDS:-}
      BACKEND_URL:            ${BACKEND_URL:-}
      STORE_BOT_TOKEN:        ${STORE_BOT_TOKEN:-}
      STORE_BOT_WEBHOOK_URL:  ${STORE_BOT_WEBHOOK_URL:-}
      # Eskiz.uz SMS gateway
      ESKIZ_ENABLED:        ${ESKIZ_ENABLED:-true}
      ESKIZ_BASE_URL:       ${ESKIZ_BASE_URL:-https://notify.eskiz.uz}
      ESKIZ_EMAIL:          ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD:       ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM:           ${ESKIZ_FROM:-4546}
      ESKIZ_CALLBACK_URL:   ${ESKIZ_CALLBACK_URL:-}
    volumes:
      # Winston daily-rotate logs (backend writes here, logrotate reads here)
      - ./logs/backend:/app/logs
      # Public/uploaded files shared across replicas
      - ./apps/backend/public:/app/public
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - diametr_net
    deploy:
      replicas: 2            # Docker Compose v2 honours this without Swarm
      restart_policy:
        condition: on-failure
        max_attempts: 5
    # No ports exposed — nginx accesses backend:8888 over the internal network

  # ─── Frontend — diametr.uz ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: diametr_frontend
    restart: unless-stopped
    networks:
      - diametr_net

  # ─── Dashboard — dashboard.diametr.uz / admin.diametr.uz ─────────────────────
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: https://api.diametr.uz/api/v1
        VITE_STATIC_PATH: https://api.diametr.uz
    container_name: diametr_dashboard
    restart: unless-stopped
    networks:
      - diametr_net

  # ─── Shop Admin — shop.diametr.uz ────────────────────────────────────────────
  shop_admin:
    build:
      context: ./apps/shop-admin
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: https://api.diametr.uz/api/v1
        VITE_STATIC_PATH: https://api.diametr.uz
    container_name: diametr_shop_admin
    restart: unless-stopped
    networks:
      - diametr_net

  # ─── Nginx — entry point, load balancer, cache, traffic logs ──────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: diametr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # PHASE 1 (HTTP only — sertifikat olish uchun): nginx.conf
      # PHASE 2 (SSL ishlayotganda): nginx-ssl.conf
      # - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/cache:/var/cache/nginx
      # Separate zone for /static/ images (see proxy_cache_path static_cache).
      # Persisted on disk so the image cache survives container restarts.
      - ./infra/nginx/cache-static:/var/cache/nginx-static
      # Uploaded images, served directly off disk by nginx (see location /static/).
      # Read-only: only the backend writes here.
      - ./apps/backend/public:/var/www/static:ro
      - ./logs/nginx:/var/log/nginx
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
      - dashboard
      - shop_admin
    networks:
      - diametr_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Certbot — SSL sertifikat va auto-renewal (har 12 soatda) ────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: diametr_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - diametr_net

  # ─── Log rotator — gzips nginx logs daily, keeps 30 days ─────────────────────
  logrotate:
    build:
      context: ./infra
      dockerfile: Dockerfile.logrotate
    container_name: diametr_logrotate
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      # Shares the same nginx log directory
      - ./logs/nginx:/logs/nginx
    networks:
      - diametr_net

  # ─── Prisma Studio ─────────────────────────────────────────────────────────
  # Web-based DB viewer at http://localhost:5555
  # In production: SSH tunnel → ssh -L 5555:localhost:5555 user@server
  # ⚠️  Do NOT expose port 5555 publicly in production (no auth by default)
  prisma-studio:
    image: node:20-alpine
    container_name: diametr_prisma_studio
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm i -g prisma@6 2>/dev/null; npx prisma studio --port 5555 --hostname 0.0.0.0"
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      # Share prisma schema folder
      - ./apps/backend/prisma:/app/prisma
    ports:
      # Bind only to localhost — use SSH tunnel from remote
      - "127.0.0.1:5555:5555"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - diametr_net


# ─── Network ──────────────────────────────────────────────────────────────────
networks:
  diametr_net:
    driver: bridge


# ─── Named volumes (opt-in) ───────────────────────────────────────────────────
# If you prefer Docker-managed volumes instead of bind mounts, uncomment:
# volumes:
#   mysql_data:
#   backend_logs:
#   nginx_logs:
#   nginx_cache:
