user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format traffic
        '$remote_addr | [$time_local] | "$request" | $status | '
        '$body_bytes_sent bytes | ${request_time}s | '
        '"$http_x_forwarded_for"';

    # Which image variant a client ended up with, and what it told us about itself.
    log_format static_fmt
        '$remote_addr | $status | $body_bytes_sent B | $sent_http_content_type | '
        'req="$uri" | accept="$http_accept" | ua="$http_user_agent"';

    access_log /var/log/nginx/access.log traffic buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # ── Gzip ────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Proxy cache ─────────────────────────────────────────────────────────────
    # API microcache (TTL 2s, see location /api/). inactive=2m so entries that
    # nobody asks for — including stale ones kept for use_stale — are dropped
    # quickly instead of lingering for 10 minutes.
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=api_cache:20m
        max_size=500m
        inactive=2m
        use_temp_path=off;

    # Static (uploaded images) get their own zone: 8+ MB per file means the
    # 500m api_cache holds only ~58 images, and the short-TTL API traffic evicts
    # them constantly. Separate path — NOT a subdirectory of /var/cache/nginx,
    # otherwise the api_cache loader/manager would walk these files too.
    proxy_cache_path /var/cache/nginx-static
        levels=1:2
        keys_zone=static_cache:50m
        max_size=5g
        inactive=30d
        use_temp_path=off;

    proxy_cache_key "$scheme$request_method$host$request_uri";

    # ── WebP content negotiation ────────────────────────────────────────────────
    # Uploaded images have a pre-generated "<name>.<ext>.webp" companion (43x
    # smaller). We serve it ONLY to clients we know can decode WebP, and fall
    # back to the original byte-for-byte for anyone else. Nothing in the DB, the
    # API payload or the published mobile app changes — the URL stays identical.
    #   - browsers advertise it in Accept
    #   - Flutter's CachedNetworkImage (dart:io HttpClient) sends no Accept but
    #     identifies itself as "Dart/<version>"; WebP is supported on every
    #     Flutter target we ship to.
    map $http_accept $webp_from_accept {
        default   "";
        "~*webp"  ".webp";
    }
    map $http_user_agent $webp_suffix {
        default    $webp_from_accept;
        "~*Dart/"  ".webp";
    }

    # ── Client IP ───────────────────────────────────────────────────────────────
    # nginx is the internet edge (TLS ends here, no CDN or load balancer in
    # front), so $remote_addr already is the real client address. Do NOT trust
    # X-Forwarded-For: with `set_real_ip_from 0.0.0.0/0` every client could pick
    # its own $remote_addr and walk around limit_req. If a CDN/LB is ever put in
    # front, add `set_real_ip_from <its ranges only>` + `real_ip_header`.
    # Upstreams get X-Forwarded-For = $remote_addr (not $proxy_add_x_forwarded_for)
    # so a client-invented chain is never passed on.

    # ── Docker internal DNS resolver ────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy buffering (avoid temp file warnings for large assets) ────────────
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # ── Rate limiting ────────────────────────────────────────────────────────────
    # 600 r/m ≈ 10 r/s per IP — comfortably absorbs SWR polling from the
    # admin dashboard while still protecting against abusive clients.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
    # Uploaded images (/static/) get their own, more generous bucket: a product
    # grid can pull hundreds of pictures at once, and those must neither starve
    # the same visitor's API calls nor be starved by them.
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=1200r/m;
    # SMS endpoints: every /sms/send is a paid Eskiz SMS and /sms/verify is where
    # a 6-digit code could be guessed. Still generous enough for many phones
    # behind one carrier (CGNAT) address.
    limit_req_zone $binary_remote_addr zone=sms_limit:10m rate=20r/m;

    # ── Default server for healthcheck ───────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        location / {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }

    # ── SSL global settings ──────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header          Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ════════════════════════════════════════════════════════════════════════════
    # 1. diametr.uz
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name diametr.uz www.diametr.uz;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name diametr.uz www.diametr.uz;

        ssl_certificate     /etc/letsencrypt/live/diametr.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/diametr.uz/privkey.pem;

        access_log /var/log/nginx/frontend-access.log traffic buffer=8k flush=5s;
        error_log  /var/log/nginx/frontend-error.log  warn;

        location / {
            set $upstream http://frontend:80;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ════════════════════════════════════════════════════════════════════════════
    # 2. dashboard.diametr.uz / admin.diametr.uz
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name dashboard.diametr.uz admin.diametr.uz;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name dashboard.diametr.uz admin.diametr.uz;

        ssl_certificate     /etc/letsencrypt/live/diametr.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/diametr.uz/privkey.pem;

        access_log /var/log/nginx/dashboard-access.log traffic buffer=8k flush=5s;

        location / {
            set $upstream http://dashboard:80;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ════════════════════════════════════════════════════════════════════════════
    # 3. shop.diametr.uz
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name shop.diametr.uz;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name shop.diametr.uz;

        ssl_certificate     /etc/letsencrypt/live/diametr.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/diametr.uz/privkey.pem;

        access_log /var/log/nginx/shop-admin-access.log traffic buffer=8k flush=5s;

        location / {
            set $upstream http://shop_admin:80;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ════════════════════════════════════════════════════════════════════════════
    # 4. api.diametr.uz
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name api.diametr.uz;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.diametr.uz;

        ssl_certificate     /etc/letsencrypt/live/diametr.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/diametr.uz/privkey.pem;

        access_log /var/log/nginx/api-access.log traffic buffer=16k flush=2s;

        # ── Rate limit for EVERY path of this host ─────────────────────────────
        # Declared here, not only in `location /api/`: nginx location matching is
        # case-sensitive but the Nest router is not, so /API/v1/... lands in
        # `location /` and used to skip the limit (and the cache). Locations that
        # declare their own limit_req (/static/, the SMS one) replace this line.
        # nginx applies limit_req once per request, so internal redirects
        # (error_page, try_files -> @named) are never counted twice.
        limit_req        zone=api_limit burst=300 nodelay;
        # 429 (not the default 503) so a rate-limited client is not told the
        # backend is down.
        limit_req_status 429;
        # Inherited only by locations that declare no error_page of their own —
        # /api/ and the SMS location repeat it.
        error_page 429 = @api_rate_limited;

        # Uploaded images are served straight off disk by nginx (sendfile), not
        # proxied through the Node process. The upload volume is mounted
        # read-only at /var/www/static — see docker-compose nginx volumes.
        # try_files prefers the pre-generated .webp companion when the client
        # can decode it, otherwise falls back to the original file.
        location /static/ {
            root /var/www;
            try_files $uri$webp_suffix $uri @static_backend;

            # Own bucket (see static_limit); also covers the @static_backend
            # fallback, which is not counted a second time.
            limit_req zone=static_limit burst=600 nodelay;

            # Upload names are unique (Date.now()-random.ext) and never rewritten,
            # so the response is safely immutable.
            # NOTE: `expires` emits its own Cache-Control, which would duplicate
            # the header — set max-age here instead and leave `expires` off.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary          "Accept, User-Agent" always;
            add_header X-Static-Src  "nginx-disk" always;
            # Uploads are user content: never let a browser sniff them into
            # something else, and if one is opened directly (e.g. an old SVG with
            # a <script>) it renders sandboxed with no script/network access.
            # Harmless for <img>/Image.network use — CSP only governs documents.
            add_header X-Content-Type-Options  "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;

            # Records which variant each real client actually receives, so we can
            # confirm the WebP negotiation works for the Flutter app (which sends
            # no Accept header) as well as for browsers.
            access_log /var/log/nginx/static-access.log static_fmt buffer=8k flush=5s;
            open_file_cache          max=2000 inactive=5m;
            open_file_cache_valid    2m;
            open_file_cache_min_uses 1;
            open_file_cache_errors   off;
        }

        # Fallback: if the file is not on the mounted volume (e.g. written by a
        # backend replica before the mount propagated), let Node answer.
        location @static_backend {
            # Variable form so the name is resolved per-request via `resolver`,
            # matching the other locations — a literal upstream would make nginx
            # fail to start whenever the backend container is down.
            set $upstream http://backend:8888;
            proxy_pass         $upstream;
            proxy_cache        static_cache;
            proxy_ignore_headers Cache-Control Expires X-Accel-Expires Set-Cookie;
            proxy_cache_valid  200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            add_header         X-Cache-Status $upstream_cache_status always;
            # Same as /static/ (add_header is not inherited across locations).
            add_header         X-Content-Type-Options  "nosniff" always;
            add_header         Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
        }

        location /api/ {
            # Rate limit: the server-level api_limit above (declared once there
            # so it also covers paths that miss this location).
            set $upstream http://backend:8888;

            # ── CORS (always, including 4xx/5xx errors) ─────────────────────────
            # NestJS ham CORS qo'shadi; bu yerda biz faqat ERROR javoblarda
            # (502/503/504) browser CORS xatosini oldini olish uchun "always" bilan qo'shamiz.
            # Success javoblarda NestJS header'i yetarli — duplicate bo'lmaydi chunki
            # NestJS faqat success uchun javob qaytaradi, nginx 5xx error sahifasi uchun
            # alohida.
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Max-Age'           86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain charset=UTF-8';
                return 204;
            }

            # Custom error pages with CORS headers (so browser can read 5xx errors)
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_error;
            # limit_req rejections. (With intercept on, a 429 sent by the backend
            # itself on these routes would get this generic body too; the backend's
            # own 429s — SMS resend cooldown, login throttle — go through the SMS
            # and auth/login locations below, which do not intercept.)
            error_page 429 = @api_rate_limited;

            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Microcache for anonymous GETs: 2s is enough to absorb bursts (with
            # the lock below at most ~1 upstream request per URL every 2s) while
            # a price/product change made in a panel is visible to customers on
            # their next normal reload or navigation — no hard refresh needed.
            proxy_cache              api_cache;
            proxy_cache_methods      GET HEAD;
            proxy_cache_valid        200 2s;
            proxy_cache_valid        404 1s;
            # Authorization, Cache-Control or Pragma → go to the backend. The
            # fresh anonymous answer is still STORED (proxy_no_cache only skips
            # authenticated responses), so one reload refreshes it for everyone.
            proxy_cache_bypass       $http_authorization $http_cache_control $http_pragma;
            proxy_no_cache           $http_authorization;
            add_header               X-Cache-Status $upstream_cache_status always;
            # Never let the BROWSER cache API JSON — otherwise updated data keeps
            # showing stale until a hard refresh. (nginx still caches 2s server-
            # side for anonymous GETs; authenticated requests bypass that above.)
            add_header               Cache-Control "no-store" always;
            # Stale copies only while the entry is being refreshed or the backend
            # is down/restarting. NOT on http_500: a real application error must
            # surface instead of hiding behind the last good answer indefinitely.
            proxy_cache_use_stale    updating error timeout http_502 http_503 http_504;
            proxy_cache_lock         on;
            proxy_cache_lock_age     5s;
            proxy_cache_lock_timeout 5s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            client_max_body_size 25m;
        }

        # ── SMS login endpoints: stricter per-IP limit ─────────────────────────
        # /sms/send (paid Eskiz SMS) and /sms/verify (OTP guessing). ~* because
        # the Nest router is case-insensitive (/API/V1/SMS/send reaches it too).
        # The Eskiz delivery-report webhook (/sms/eskiz-callback) is excluded:
        # Eskiz's own servers call it once per SMS, so it keeps the general limit.
        # A regex location wins over the /api/ prefix, so these requests are
        # handled only here: same proxy/CORS setup as /api/, minus the cache
        # (these routes are POST-only).
        location ~* ^/api/v1/sms/(?!eskiz-callback) {
            limit_req zone=api_limit burst=300 nodelay;
            limit_req zone=sms_limit burst=10  nodelay;
            set $upstream http://backend:8888;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Max-Age'           86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain charset=UTF-8';
                return 204;
            }

            # No proxy_intercept_errors here: the backend answers 429 itself
            # ("Kodni qayta yuborish uchun biroz kuting") and that message must
            # reach the client untouched. nginx's own errors — the limit_req 429
            # and 502/504 when the backend is unreachable — still use these pages.
            error_page 429 = @api_rate_limited;
            error_page 502 503 504 = @api_error;

            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control     "no-store" always;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            client_max_body_size 25m;
        }

        # ── Panel password login: backend 429 must reach the panel untouched ───
        # auth/login-throttle.ts answers repeated wrong passwords with its own 429
        # ("Juda ko'p noto'g'ri urinish. 15 daqiqadan so'ng ...") and both panels
        # show `message`. `location /api/` intercepts upstream errors
        # (proxy_intercept_errors on + error_page 429) and would replace it with
        # the generic rate-limit text, so login is proxied here WITHOUT
        # interception. Rate limit: the server-level api_limit (inherited — no
        # limit_req of its own). POST-only → no cache.
        location ~* ^/api/v1/auth/login/?$ {
            set $upstream http://backend:8888;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true'        always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                add_header 'Access-Control-Max-Age'           86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain charset=UTF-8';
                return 204;
            }

            # nginx's own errors only (no proxy_intercept_errors).
            error_page 429 = @api_rate_limited;
            error_page 502 503 504 = @api_error;

            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            add_header         Cache-Control     "no-store" always;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            client_max_body_size 25m;
        }

        location @api_error {
            add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true'         always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
            add_header 'Content-Type' 'application/json' always;
            return 503 '{"statusCode":503,"message":"Backend is unavailable"}';
        }

        # limit_req rejections on any path of this host (limit_req_status 429).
        # Same CORS headers as @api_error so the site/panels can read `message`.
        location @api_rate_limited {
            add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true'         always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
            add_header 'Cache-Control' 'no-store' always;
            # Empty `types` → always application/json, whatever the extension of
            # the rejected URI (e.g. /static/x.jpg).
            types { }
            default_type application/json;
            return 429 "{\"statusCode\":429,\"message\":\"Juda ko'p so'rov, birozdan so'ng urinib ko'ring\"}";
        }

        location / {
            set $upstream http://backend:8888;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 25m;
        }
    }
}
