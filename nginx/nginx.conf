user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Traffic log format ──────────────────────────────────────────────────────
    # Fields: client_ip | time | "METHOD /path HTTP" | status | bytes | response_time
    log_format traffic
        '$remote_addr | [$time_local] | "$request" | $status | '
        '$body_bytes_sent bytes | ${request_time}s | '
        '"$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log traffic buffer=16k flush=5s;
    error_log  /var/log/nginx/error.log  warn;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;

    # ── Gzip ────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Proxy cache ─────────────────────────────────────────────────────────────
    # Only GET/HEAD responses from the API are cached
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=api_cache:20m
        max_size=500m
        inactive=10m
        use_temp_path=off;

    proxy_cache_key "$scheme$request_method$host$request_uri";

    # ── Client IP ───────────────────────────────────────────────────────────────
    # nginx is the internet edge (no CDN or load balancer in front), so
    # $remote_addr already is the real client address. Do NOT trust
    # X-Forwarded-For: with `set_real_ip_from 0.0.0.0/0` every client could pick
    # its own $remote_addr and walk around limit_req. If a CDN/LB is ever put in
    # front, add `set_real_ip_from <its ranges only>` + `real_ip_header`.
    # Upstreams get X-Forwarded-For = $remote_addr (not $proxy_add_x_forwarded_for)
    # so a client-invented chain is never passed on.

    # ── Docker internal DNS resolver ────────────────────────────────────────────
    # resolver orqali DNS runtime da resolve qilinadi (startup da emas)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Rate limiting ───────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    # Uploaded images get their own, more generous bucket (see nginx-ssl.conf).
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=1200r/m;
    # SMS endpoints (paid Eskiz SMS / OTP guessing) — stricter.
    limit_req_zone $binary_remote_addr zone=sms_limit:10m rate=20r/m;

    # ────────────────────────────────────────────────────────────────────────────
    # 1. diametr.uz  — main public site  [PHASE 1: HTTP only — cert olish uchun]
    # ────────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name diametr.uz www.diametr.uz;

        access_log /var/log/nginx/frontend-access.log traffic buffer=8k flush=5s;
        error_log  /var/log/nginx/frontend-error.log  warn;

        # Certbot webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Log upstream errors clearly
            proxy_intercept_errors on;
            proxy_connect_timeout  10s;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;

            error_page 502 503 504 =503 @frontend_down;
        }

        location @frontend_down {
            add_header Content-Type text/plain;
            return 503 "diametr.uz: frontend service is down. Check: docker compose logs frontend";
        }
    }

    # ────────────────────────────────────────────────────────────────────────────
    # 2. dashboard.diametr.uz & admin.diametr.uz  — admin dashboard
    # ────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name dashboard.diametr.uz admin.diametr.uz;

        access_log /var/log/nginx/dashboard-access.log traffic buffer=8k flush=5s;
        # Certbot webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            proxy_pass         http://dashboard:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ────────────────────────────────────────────────────────────────────────────
    # 3. shop.diametr.uz  — shop admin panel
    # ────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name shop.diametr.uz;

        access_log /var/log/nginx/shop-admin-access.log traffic buffer=8k flush=5s;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass         http://shop_admin:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ────────────────────────────────────────────────────────────────────────────
    # 4. api.diametr.uz  — NestJS backend (load balanced, cached)
    # ────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.diametr.uz;

        # Separate traffic log so API logs can be rotated independently
        access_log /var/log/nginx/api-access.log traffic buffer=16k flush=2s;

        # ── Rate limit for EVERY path of this host (see nginx-ssl.conf) ────────
        # Not only /api/: location matching is case-sensitive but the Nest router
        # is not, so /API/v1/... lands in `location /`. Locations with their own
        # limit_req (/static/, SMS) replace this; limit_req applies once per
        # request, so internal redirects are not counted twice.
        limit_req        zone=api_limit burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;

        # Certbot webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # ── Static files served directly from backend public folder ─────────────
        location /static/ {
            set $backend "http://backend:8888";
            proxy_pass         $backend;
            proxy_cache        api_cache;
            proxy_cache_valid  200 1d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            add_header         X-Cache-Status $upstream_cache_status;
            # Uploads are user content: no MIME sniffing, and a directly opened
            # file (e.g. an old SVG) renders sandboxed without scripts.
            add_header         X-Content-Type-Options  "nosniff" always;
            add_header         Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
            limit_req          zone=static_limit burst=600 nodelay;

            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;

            expires 7d;
        }

        # ── API endpoints — rate limited, anonymous GET responses cached 2s ─────
        # (same microcache policy as nginx-ssl.conf, so falling back to this
        # PHASE 1 config never brings back stale-until-hard-refresh data)
        location /api/ {
            # Rate limit: the server-level api_limit above.

            # ── CORS ────────────────────────────────────────────────────────
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With';
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            set $backend "http://backend:8888";
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Cache only safe, idempotent reads
            proxy_cache              api_cache;
            proxy_cache_methods      GET HEAD;
            proxy_cache_valid        200 2s;
            proxy_cache_valid        404 1s;
            proxy_cache_bypass       $http_authorization $http_cache_control $http_pragma;
            proxy_no_cache           $http_authorization;
            add_header               X-Cache-Status $upstream_cache_status always;
            # No http_500: real application errors must not hide behind stale data
            proxy_cache_use_stale    updating error timeout http_502 http_503 http_504;
            proxy_cache_lock         on;   # coalesce duplicate requests
            proxy_cache_lock_age     5s;
            proxy_cache_lock_timeout 5s;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Large uploads (multipart)
            client_max_body_size 25m;
        }

        # ── SMS login endpoints: stricter per-IP limit (see nginx-ssl.conf) ─────
        # Case-insensitive like the Nest router; the Eskiz delivery webhook
        # (/sms/eskiz-callback) keeps the general limit. POST-only → no cache.
        location ~* ^/api/v1/sms/(?!eskiz-callback) {
            limit_req zone=api_limit burst=120 nodelay;
            limit_req zone=sms_limit burst=10  nodelay;

            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With';
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            set $backend "http://backend:8888";
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            client_max_body_size 25m;
        }

        # limit_req rejections on any path of this host (limit_req_status 429),
        # JSON with CORS so the site/panels can read `message`.
        location @api_rate_limited {
            add_header 'Access-Control-Allow-Origin'      "$http_origin" always;
            add_header 'Access-Control-Allow-Credentials' 'true'         always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
            add_header 'Cache-Control' 'no-store' always;
            types { }
            default_type application/json;
            return 429 "{\"statusCode\":429,\"message\":\"Juda ko'p so'rov, birozdan so'ng urinib ko'ring\"}";
        }

        # ── Catch-all for anything not matched above ─────────────────────────────
        location / {
            set $backend "http://backend:8888";
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            client_max_body_size 25m;
        }
    }
}
