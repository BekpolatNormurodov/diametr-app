server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback – all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must NEVER be cached — it points at the current hashed bundle.
    # Caching it makes browsers keep loading a stale bundle until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Cache static assets in the browser
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
