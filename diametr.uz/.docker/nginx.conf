server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback – all unknown paths → index.html
    # Real files answered here (manifest.json, robots.txt, sitemap.xml, the
    # privacy-policy .md files, asset-manifest.json …) keep the same name on every
    # deploy, so the browser must revalidate them (cheap 304 via ETag). The
    # index.html fallback is an internal redirect and gets the no-store headers
    # of `location = /index.html` below, not this one.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # index.html must NEVER be cached — it points at the current hashed bundle.
    # Caching it makes browsers keep loading a stale bundle until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # CRA build output: every file under /static/ (js, css, media, fonts) has a
    # content hash in its name, so a new deploy always means new URLs → cache
    # forever. (No `expires` here: it would emit a second Cache-Control header.)
    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Everything else with a static extension comes from public/ with a FIXED
    # name (logo2.ico, favicon.ico, images/payme.png …). A deploy can replace it
    # in place, so it must be revalidated, never "immutable".
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
